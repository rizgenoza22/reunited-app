  ios-testflight-build:
    name: REunited iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic REunited

    environment:
      node: 22
      xcode: latest

      vars:
        BUNDLE_ID: "com.reunited.ph"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Initialize signing keychain
        script: keychain initialize

      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate
        script: keychain add-certificates

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true